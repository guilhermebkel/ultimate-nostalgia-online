name: Task (spec for an agent or a person)
description: A piece of work written so that someone can do it from this issue alone, without the conversation that created it.
title: "[task] "
labels: ["task", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Write it so an agent that only reads this issue can do it. One issue is one pull request. If it needs two, split it.
        **Never paste real user data, private content or secrets.**
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Page and styles
        - Games and texts
        - SEO
        - Harness and CI
        - Brand kit
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this exists and what the reader needs to know. Link the feature request or bug it comes from.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: A numbered checklist in the order it should be done. Each item can be checked by someone else.
      placeholder: |
        - [ ] S1. ...
        - [ ] S2. ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What looks related but belongs to another issue (link it).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Numbered, one behavior each, written as `WHEN <condition> THEN <observable result>`. Put the edge cases in the same list, marked `[edge]`.
      placeholder: |
        - **AC1** WHEN ... THEN ...
        - **AC2** [edge] WHEN ... THEN ...
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: What must be proven, by AC number where it helps. Never the kind of test or a tool; the agent picks the level (docs/test-standards.md).
    validations:
      required: true
  - type: textarea
    id: where-to-look
    attributes:
      label: Where to look
      description: Files, ADRs, GLOSSARY terms and issues the agent should read first.
  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      placeholder: none
    validations:
      required: true
